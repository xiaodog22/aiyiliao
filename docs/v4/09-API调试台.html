<meta charset="utf-8" />

<title>医疗 AI 小程序 · API 调试台（契约驱动）</title>
<style>
  :root{

  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
  header.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:10px 16px}
  header.top h1{font-size:16px;margin:0 0 8px;color:var(--primary)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bar input[type=text]{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px}
  #baseUrl{width:280px}
  #token{width:300px}
  button{cursor:pointer;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:6px;padding:6px 12px;font-size:13px}
  button.ghost{background:#fff;color:var(--primary)}
  button:disabled{opacity:.5;cursor:not-allowed}
  label.opt{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
  .msg{font-size:12px;margin-left:8px}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .layout{display:flex;align-items:flex-start}
  nav.side{width:220px;flex:0 0 220px;position:sticky;top:130px;height:calc(100vh - 130px);overflow:auto;padding:12px;border-right:1px solid var(--border);background:#fff}
  nav.side h3{font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  nav.side a{display:flex;justify-content:space-between;padding:5px 8px;border-radius:6px;color:var(--text);text-decoration:none;font-size:13px}
  nav.side a:hover{background:var(--primary-weak)}
  nav.side a .n{color:var(--muted);font-size:11px}
  main{flex:1;padding:16px;min-width:0}
  .search{width:100%;max-width:520px;margin-bottom:12px}
  section.cat{margin-bottom:24px}
  section.cat > h2{font-size:15px;border-left:4px solid var(--primary);padding-left:8px;margin:0 0 10px}
  section.cat > .catdesc{color:var(--muted);font-size:12px;margin:-6px 0 12px}
  article.ep{border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:12px;overflow:hidden}
  .ep .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FBFCFD;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .method{font-weight:700;color:#fff;border-radius:5px;padding:2px 8px;font-size:12px;min-width:58px;text-align:center}
  .MGET{background:var(--get)} .MPOST{background:var(--post)} .MPUT{background:var(--put)} .MPATCH{background:var(--patch)} .MDELETE{background:var(--delete)} .MOPTIONS,.MHEAD{background:var(--muted)}
  .path{flex:1;min-width:240px;border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--primary)}
  .opid{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px}
  .chip{font-size:11px;border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--muted);font-family:ui-monospace,monospace}
  .chip.ok{color:var(--ok);border-color:#B3E6BD}
  .chip.err{color:var(--err);border-color:#FBC4C4}
  .badge{font-size:11px;border-radius:4px;padding:1px 6px}
  .badge.idem{background:#FFF3E8;color:var(--warn)}
  .badge.prov{background:#FFECE8;color:var(--err)}
  .badge.gw{background:var(--primary-weak);color:var(--primary)}
  .badge.int{background:#F2F3F5;color:var(--muted)}
  details{padding:0 12px 12px}
  details summary{cursor:pointer;color:var(--primary);font-size:13px;padding:6px 0;user-select:none}
  .desc{color:#4E5969;font-size:13px;white-space:pre-wrap;margin:4px 0 10px}
  table.params{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
  table.params th,table.params td{border:1px solid var(--border);padding:4px 8px;text-align:left}
  table.params th{background:#FAFAFB;color:var(--muted);font-weight:600}
  .fld{font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  textarea.req,pre.res,pre.out{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#FBFCFD;color:#1D2129;white-space:pre;overflow:auto}
  textarea.req{min-height:120px}
  pre.res{margin:0;background:#F7F8FA;color:#4E5969}
  pre.out{min-height:60px;margin-top:8px;background:#0E1B2E;color:#C9E0FF}
  .actions{display:flex;gap:10px;align-items:center;margin-top:8px}
  .internal-note{color:var(--warn);font-size:12px;padding:6px 0}
  .countbar{color:var(--muted);font-size:12px;margin-bottom:8px}
</style>
</head>

<header class="top">
  <h1>医疗 AI 小程序 · API 调试台 <span class="countbar" id="countbar"></span></h1>
  <div class="bar">
    <input type="text" id="baseUrl" value="http://127.0.0.1:8000" title="统一网关基址（唯一入口）" />
    <input type="text" id="token" placeholder="Bearer 令牌（点“开发者登录”自动填入）" />

    <label class="opt"><input type="checkbox" id="attachHeaders" checked /> 附加 V4 契约头 (X-Client-Version / X-Platform)</label>
    <label class="opt"><input type="checkbox" id="autoIdem" checked /> 写操作自动加 Idempotency-Key</label>
    <span class="msg" id="msg"></span>
  </div>
</header>

<div class="layout">
  <nav class="side" id="side"></nav>
  <main>
    <input type="text" class="search" id="search" placeholder="搜索：路径 / 方法 / operationId / 摘要 …" />
    <div id="content"></div>
  </main>
</div>

const $ = (s, r=document) => r.querySelector(s);
const baseUrl = $('#baseUrl'), token = $('#token'), msg = $('#msg');
const attachHeaders = $('#attachHeaders'), autoIdem = $('#autoIdem');
const content = $('#content'), side = $('#side'), search = $('#search');

function setMsg(t, kind){ msg.textContent = t || ''; msg.className = 'msg' + (kind ? ' ' + kind : ''); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'idem-' + Math.random().toString(16).slice(2)); }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function jpretty(v){ try { return JSON.stringify(v, null, 2); } catch { return String(v); } }

// 分类：可调用在前，内网面在后
const cats = [...CATALOG.callableCategories, ...CATALOG.internalCategories];
const catDesc = CATALOG.categoryDesc || {};
$('#countbar').textContent = `(可调用 ${CATALOG.counts.callable} · 网关自身 ${CATALOG.counts.gatewayOwn} · 内网面 ${CATALOG.counts.internal})`;

// 侧栏
let navHtml = '<h3>可调用接口</h3>';
for (const c of CATALOG.callableCategories){
  const n = CATALOG.endpoints.filter(e => e.category === c && !e.internal).length;
  navHtml += `<a href="#cat-${c}" data-cat="${c}">${c}<span class="n">${n}</span></a>`;
}
navHtml += '<h3>内网面（仅服务编排）</h3>';
for (const c of CATALOG.internalCategories){
  const n = CATALOG.endpoints.filter(e => e.category === c && e.internal).length;
  navHtml += `<a href="#cat-${c}" data-cat="${c}">${c}<span class="n">${n}</span></a>`;
}
side.innerHTML = navHtml;

function methodClass(m){ return 'M' + m.toUpperCase(); }

function renderEndpoints(list){
  return list.map(ep => {
    const isInt = ep.internal;
    const resChips = (ep.responses || []).map(c => {
      const cls = c.startsWith('2') ? 'ok' : (c.startsWith('4') || c.startsWith('5')) ? 'err' : '';
      return `<span class="chip ${cls}">${esc(c)}</span>`;
    }).join(' ');
    const badges = [];
    if (ep.idempotency) badges.push(`<span class="badge idem">幂等:${esc(ep.idempotency)}</span>`);
    if (ep.status === 'provisional') badges.push(`<span class="badge prov">待定 provisional</span>`);
    if (ep.gatewayOwn) badges.push(`<span class="badge gw">网关自身</span>`);
    if (isInt) badges.push(`<span class="badge int">仅内网</span>`);
    const paramsRows = (ep.params && ep.params.length)
      ? `<table class="params"><tr><th>参数</th><th>位置</th><th>必填</th><th>说明</th><th>示例</th></tr>`
        + ep.params.map(p => `<tr><td><code>${esc(p.name)}</code></td><td>${esc(p.in)}</td><td>${p.required?'是':'否'}</td><td>${esc(p.description)}</td><td><code>${esc(jpretty(p.example))}</code></td></tr>`).join('') + `</table>`
      : '';
    const reqBlock = (!isInt && ep.request != null)
      ? `<div class="fld">请求体 (JSON)</div><textarea class="req">${esc(jpretty(ep.request))}</textarea>`
      : '';
    const resBlock = (ep.success != null)
      ? `<div class="fld">成功响应示例</div><pre class="res">${esc(jpretty(ep.success))}</pre>`
      : (isInt ? '' : `<div class="fld">成功响应示例</div><pre class="res">（见契约 / 本页仅文档）</pre>`);
    const actionBlock = isInt
      ? `<div class="internal-note">⚠ 该接口为内网面（${esc(ep.path)}），客户端经网关不可达，本页不发送请求。</div>`
      : `<div class="actions"><button class="send">发送请求</button><span class="out-status msg"></span></div><pre class="out" style="display:none"></pre>`;
    return `<article class="ep" data-cat="${esc(ep.category)}" data-search="${esc((ep.method+' '+ep.path+' '+(ep.operationId||'')+' '+(ep.summary||'')).toLowerCase())}">
      <div class="hd">
        <span class="method ${methodClass(ep.method)}">${esc(ep.method)}</span>
        <input class="path" value="${esc(ep.path)}" />
        <span class="opid">${esc(ep.operationId||'')}</span>
      </div>
      <div class="meta">${resChips} ${badges.join(' ')}</div>
      <details>
        <summary>${esc(ep.summary || '详情')}</summary>
        <div class="desc">${esc(ep.description || '（无描述）')}</div>
        ${paramsRows}
        ${reqBlock}
        ${resBlock}
        ${actionBlock}
      </details>
    </article>`;
  }).join('');
}

function render(){
  const q = (search.value || '').trim().toLowerCase();
  let html = '';
  for (const c of cats){
    const list = CATALOG.endpoints.filter(e => e.category === c);
    if (!list.length) continue;
    let shown = list;
    if (q) shown = list.filter(e => (e.method+' '+e.path+' '+(e.operationId||'')+' '+(e.summary||'')).toLowerCase().includes(q));
    if (!shown.length) continue;
    const isInt = !!list[0].internal;
    html += `<section class="cat" id="cat-${c}">
      <h2>${esc(c)}${isInt ? ' · 内网面' : ''}</h2>
      <div class="catdesc">${esc(catDesc[c] || '')}</div>
      ${renderEndpoints(shown)}
    </section>`;
  }
  content.innerHTML = html || '<p style="color:var(--muted)">无匹配接口。</p>';
}

// 事件委托
content.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('.send');
  if (!btn) return;
  const card = btn.closest('.ep');
  const epPath = card.querySelector('.path').value.trim();
  const method = card.querySelector('.method').textContent.trim();
  const outStatus = card.querySelector('.out-status');
  const out = card.querySelector('.out');
  out.style.display = 'block';
  const base = baseUrl.value.trim().replace(/\/+$/, '');
  const url = base + epPath;
  const headers = { 'Content-Type': 'application/json' };
  if (token.value.trim()) headers['Authorization'] = 'Bearer ' + token.value.trim();
  if (attachHeaders.checked){ headers['X-Client-Version'] = '1.0.0'; headers['X-Platform'] = 'wechat-miniprogram'; }
  const isWrite = ['POST','PUT','PATCH'].includes(method);
  if (autoIdem.checked && isWrite){ headers['Idempotency-Key'] = uid(); }
  const opts = { method, headers };
  if (isWrite){
    const ta = card.querySelector('.req');
    if (ta && ta.value.trim()){
      try { JSON.parse(ta.value); } catch(e){ out.textContent = '请求体不是合法 JSON：' + e.message; outStatus.textContent=''; outStatus.className='out-status msg err'; return; }
      opts.body = ta.value;
    }
  }
  const t0 = performance.now();
  outStatus.textContent = '请求中…'; outStatus.className = 'out-status msg';
  try{
    const res = await fetch(url, opts);
    const text = await res.text();
    let pretty = text; try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch {}
    out.textContent = `HTTP ${res.status} ${res.statusText}  ·  ${Math.round(performance.now()-t0)}ms\n\n` + pretty;
    outStatus.textContent = `HTTP ${res.status}`;
    outStatus.className = 'out-status msg ' + (res.ok ? 'ok' : 'err');
  }catch(e){
    out.textContent = '请求失败：' + e.message + '\n（跨域被拦截？确认网关已启用 CORS，或经网关同源地址打开本页）';
    outStatus.textContent = 'CORS/网络错误'; outStatus.className = 'out-status msg err';
  }
});

$('#loginBtn').addEventListener('click', async () => {
  const base = baseUrl.value.trim().replace(/\/+$/, '');
  const url = base + '/api/v1/auth/wechat/login';
  const headers = {'Content-Type':'application/json','X-Client-Version':'1.0.0','X-Platform':'wechat-miniprogram'};
  const body = JSON.stringify({ code: 'dev-user-1-code', consentVersion: 'v1.0' });
  setMsg('登录中…');
  try{
    const res = await fetch(url, { method:'POST', headers, body });
    const data = await res.json();
    const tok = data && data.data && data.data.accessToken;
    if (tok){ token.value = tok; setMsg('开发者登录成功，已填入 token（' + tok.length + ' 字符）', 'ok'); }
    else { setMsg('登录响应异常：' + JSON.stringify(data).slice(0,160), 'err'); }
  }catch(e){ setMsg('登录失败：' + e.message, 'err'); }
});
$('#clearToken').addEventListener('click', () => { token.value=''; setMsg('已清空 token'); });
search.addEventListener('input', render);

render();
</script>
</body>
</html>
