# =============================================================================
# 本地等价验证用（不是云托管部署文件）
# 目的：在买 CDB / 备案域名之前，先用 docker 复现"云托管"的拓扑与网络隔离，
#       提前暴露：DB 连接、时区、资源目录、容器间调用、健康检查等问题。
#
# 用法（在 backend/ 下）：
#   docker compose up -d --build
#   docker compose logs -f gateway
#   docker compose down -v
#
# 云上差异（必须知道）：
#   · 云托管容器磁盘是**临时的**，MySQL 不能放容器里，必须用独立 CDB（本文件仅本地用）
#   · 云托管只读取容器端口，本文件的 ports 映射仅本地调试
# =============================================================================
name: wechar-local

services:
  mysql:
    image: mysql:8.0
    environment:
      # 2026-11-18（审计 H7）：去掉可用的默认口令 —— 用 ${VAR:?} 缺失即让 compose 直接报错退出，
      # 而不是"悄悄用 local_root 起来"。宿主机不再发布 3306（见下方 ports 说明）。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须注入 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wechar
      # 审计 H7：业务使用专用账号（镜像会把 MYSQL_DATABASE 的权限授给它），root 只用于初始化
      MYSQL_USER: ${MYSQL_DB_USER:-wechar_app}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD:?必须注入 MYSQL_DB_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 审计 H7：不发布数据库端口。需要本地用客户端连库时临时加回 "13306:3306" 并自担风险。
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  business:
    build:
      context: .
      dockerfile: deploy/docker/business.Dockerfile
    environment:
      # ⚠️ 变量名是 MYSQL_*（application.yml 的占位符），不是 SPRING_DATASOURCE_*
      MYSQL_URL: jdbc:mysql://mysql:3306/wechar?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      MYSQL_USER: ${MYSQL_DB_USER:-wechar_app}
      MYSQL_PASSWORD: ${MYSQL_DB_PASSWORD:?必须注入 MYSQL_DB_PASSWORD}
      # 2026-11-18（审计 C1/H7）：不再默认 dev 档 —— 档位必须显式注入，
      # 避免"整段复制到真实部署"时把 dev provider（含 dev 登录闸门）一起带上生产。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?必须显式注入 SPRING_PROFILES_ACTIVE（本地 dev / 生产 prod）}
      # 启动即校验的三把密钥：缺失直接拒绝启动（不再有"可用默认值"）。
      PHONE_KEY_BASE64: ${PHONE_KEY_BASE64:?必须注入 PHONE_KEY_BASE64（32 字节 base64）}
      APP_ATTACHMENT_SIGN_SECRET: ${APP_ATTACHMENT_SIGN_SECRET:?必须注入 APP_ATTACHMENT_SIGN_SECRET}
      # 审计 H2/M5/M11 启动自检：生产缺任意一把即拒绝启动（ProductionSecurityCheck @PostConstruct）
      APP_PHONE_HMAC_KEY: ${APP_PHONE_HMAC_KEY:?必须注入 APP_PHONE_HMAC_KEY（≥32 字符）}
      APP_CODE_HASH_SECRET: ${APP_CODE_HASH_SECRET:?必须注入 APP_CODE_HASH_SECRET（≥32 字符）}
      APP_AVATAR_SIGN_SECRET: ${APP_AVATAR_SIGN_SECRET:?必须注入 APP_AVATAR_SIGN_SECRET（≥32 字符）}
      APP_CONSENT_VERSION: ${APP_CONSENT_VERSION:-v1.0}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?必须注入 AI_SERVICE_TOKEN（与 ai 侧同名同值）}
      APP_RESOURCES_DIR: /app/resources
      APP_UPLOAD_DIR: /app/run/uploads
      AI_SERVICE_URL: http://ai:8001
    depends_on:
      mysql:
        condition: service_healthy
    # 审计 H7：不发布业务端口（18088 会绕过网关的限流与 XFF 归一，直达 business）。
    # 本地排障需要临时暴露时再加回 "18088:8088"。

  ai:
    build:
      context: .
      dockerfile: deploy/docker/ai.Dockerfile
    environment:
      AI_PROVIDER_ORDER: ollama,deepseek
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-http://host.docker.internal:11434}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY:-}
      AI_DEEPSEEK_BASE_URL: ${AI_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_DEEPSEEK_MODEL: ${AI_DEEPSEEK_MODEL:-deepseek-flash}
      AI_STORE_PATH: /app/runtime/tasks.json
      # 审计 M2：任务 result 正文静态加密；Fernet URL-safe base64 32 字节
      AI_STORE_ENCRYPTION_KEY: ${AI_STORE_ENCRYPTION_KEY:?必须注入 AI_STORE_ENCRYPTION_KEY（Fernet key）}
      # ai 侧令牌必须与 business 侧同值，否则 business 全部调用 401（fail-fast 更好过静默零凭证）
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?必须注入 AI_SERVICE_TOKEN}
      AI_AUTH_MODE: static
      # 审计 H10：默认 domestic，境外 provider 一票否决；不得用 allow 放开医疗数据出境。
      AI_EGRESS_POLICY: ${AI_EGRESS_POLICY:-domestic}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 审计 C3/H7：不发布 ai 端口（18001 直达 = 绕过网关读全租户任务）。

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      GW_BUSINESS_URL: http://business:8088
      GW_AI_URL: http://ai:8001
      GW_ASSETS_DIR: /app/assets
      GW_PROXY_TIMEOUT_SECONDS: "220"
      GW_RATE_LIMIT_ENABLED: "true"
      # 审计 F-01：显式声明不采信 XFF。compose 直连场景（只绑 127.0.0.1，前置可以是任意客户端）
      # 采信 XFF = 每换一个伪造值就换一个限流桶，网关与 login 限流同时失效。
      # 仅当确有可信反代（frp/Nginx 且覆盖客户端自带 XFF）时才改 true。
      GW_RATE_LIMIT_TRUST_XFF: "false"
      GW_LOG_LEVEL: INFO
    depends_on: [business, ai]
    # 审计 H7：只绑 127.0.0.1，交给 frp/反代从回环转发，避免"本机 8080 直接对局域网开放"
    ports: ["127.0.0.1:18080:8080"]

volumes:
  mysql-data:
