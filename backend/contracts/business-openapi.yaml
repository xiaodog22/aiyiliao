openapi: 3.1.0

info:
  title: 医疗 AI 智能健康小程序 · 业务后端接口契约（Spring Boot）
  version: 0.1.0-draft
  summary: 小程序可见的全部业务接口的目标态契约，由 Spring Boot 实现，经统一网关暴露。
  description: |
    ## 这份文件是什么

    这是**目标态契约（to-be）**，不是对现有服务的描述。仓库当前没有完整的 Spring Boot
    业务实现，本文声明的任何路径都不得被表述为"已上线"或"已实现"。判断实现进度必须依据
    代码、测试与运行结果，而不是这份文件。

    ## 覆盖范围

    本文覆盖**小程序能够直接调用的全部路径**，包括 AI 与语音——按 `docs/v4/03` 第 1 节，
    客户端不得绕过 Spring Boot 访问 FastAPI、Ollama、Qdrant、Redis 或 TTS 第三方，
    因此连语音与问诊这类 AI 能力也以 Spring Boot 为唯一入口，由它编排内部 FastAPI。
    FastAPI 的内部接口面见 `ai-openapi.yaml`。

    统一网关自身的 `/api/gw/**` 也列在本文（`edge-gateway` 标签），因为客户端同样直接调用
    它们；这样 `miniprogram/config/api.js` 注册表里的每一条路径都能在契约里有唯一归属。

    ## 与现有注册表的差异

    现有 `miniprogram/config/api.js` 中 `base: 'python'` 的客户端路径与上述边界冲突，
    属于**迁移债**，逐条映射见文档级扩展 `x-migration`。这些路径在新契约里不再出现；
    迁移完成前网关仍需保留转发，但不得新增同类路径。

    ## 通用约定

    - 所有响应（含错误）使用统一信封；二进制媒体不内联，改走短期签名 URL。
    - 写操作要求 `Idempotency-Key`；相同键不同载荷返回 `409`。
    - `404` 不用于区分"不存在"与"不属于你"，避免对象存在性泄漏。
    - 严禁捕获异常后返回 `200` + 空对象。
    - 具体数值（超时、TTL、保留期、限流阈值）属部署配置，不在契约中承诺。

    ## 尚未定稿的部分

    带 `x-status: provisional` 的条目**尚未定稿**，实现方不得据其单独开工：

    - `POST /internal/v1/callbacks/task-events`（待决事项 O-02）：回调路径与载荷未定稿，
      在定稿前 Spring Boot 侧以**轮询** `GET /internal/v1/tasks/{taskId}` 为唯一权威路径。

    另有两条尚未定稿，影响实现方式而非路径：

    - **对象存储上传方式（待决事项 O-01）。** 客户端直传 MinIO 与经 Spring Boot 代理
      两条路线未定。无论走哪条，对象键都必须由服务端签发，类型与大小都必须经过校验；
      不得存在绕过校验的直传通道。本契约不承诺其中任一条。
    - **TTS 合成引擎（待决事项 O-10）。** V4 计划改用 `edge-tts` 适配器，而仓库当前
      README 记录的实现是 Qwen3-TTS(WAV)，两者方向相反。契约只约定 `engine` 字段如实
      返回实际引擎，**不约定具体引擎**；在 O-10 关闭前不得按任一侧的假设改客户端。

  contact:
    name: 待确认（运营主体与联系方式未提供，见待决事项 O-06）
  license:
    name: 待确认（许可证未提供）

servers:
  - url: https://{gatewayHost}
    description: |
      生产唯一入口：统一网关。小程序只配置这一个地址。
      正式域名与备案未提供（待决事项 O-04），此处使用保留 TLD `.invalid` 占位——
      禁止使用临时隧道域名（ngrok / natapp / vicp.fun 之类）作为生产入口。
    variables:
      gatewayHost:
        default: gw.example.invalid
        description: 占位主机名，实施前替换为已备案的正式 HTTPS 域名（O-04）。
  - url: https://{gatewayHost}/api/gw
    description: 网关自身路由（`/api/gw/**`）的基准地址，仅用于文档分组展示，不改变 paths 中的完整路径。
    variables:
      gatewayHost:
        default: gw.example.invalid
        description: 同上的占位主机名。

tags:
  - name: auth
    description: 登录、令牌轮换、注销。微信凭证只在服务端换取。
  - name: me
    description: 当前用户、同意记录、注销与删除申请。
  - name: catalog
    description: 医院科室、医生、号源等只读目录。
  - name: appointment
    description: 预约挂号的创建、查询与取消。幂等与并发正确性由数据库约束保证。
  - name: patient
    description: 本人健康档案与家庭成员。
  - name: consultation
    description: AI 问诊会话与消息。权威记录在 MySQL，生成在 FastAPI。
  - name: message
    description: 消息中心（挂号通知/系统通知）。未读数是红点唯一数据源。
  - name: ai-task
    description: AI 任务状态、事件流与取消。断线后一律回到本组查询终态。
  - name: triage
    description: 导诊与急症检查。本地红旗规则优先，远端不得降低已命中等级。
  - name: care-plan
    description: 养生/照护建议。输出为生活方式建议，不构成处方。
  - name: voice
    description: 语音识别与合成。合成依赖联网第三方适配器，失败只降级为文字。
  - name: content
    description: 健康科普内容与资源清单。
  - name: doctor
    description: 医生工作台、挂号状态流转与床位管理。
  - name: home
    description: 首页聚合。不返回超出展示所必需的健康明细。
  - name: internal
    description: 服务间接口。仅内网可达，客户端永不调用。
  - name: edge-gateway
    description: 统一网关自身路由。由网关进程提供，不由 Spring Boot 提供。

security:
  - bearerAuth: []

paths:

  # ==========================================================================
  # auth
  # ==========================================================================

  /api/v1/auth/wechat/login:
    post:
      operationId: wechatLogin
      x-idempotency: not-required
      tags: [auth]
      summary: 微信登录
      description: |
        用 `wx.login` 的临时 code 换取会话。code 只在服务端消费，客户端不接触
        AppSecret、openid 或 session_key 原文。手机号绑定走 `phoneCode`（微信
        `getPhoneNumber` 返回的动态令牌），服务端解密并加密存储。
        登录本身不构成隐私政策同意——`consentVersion` 必须是用户在独立界面确认过的版本。
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WechatLoginRequest'}
      responses:
        '200':
          description: 登录成功，返回令牌与当前用户。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      x-idempotency: not-required
      tags: [auth]
      summary: 轮换访问令牌
      description: |
        刷新令牌一次一换（轮换即失效）。使用已失效令牌属于重放信号：服务端应撤销该
        会话链并返回 `401`。客户端只允许单飞刷新，不得并发发起多个 refresh。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string, minLength: 16, description: 上一次签发的刷新令牌原文；服务端只保存其哈希。}
      responses:
        '200':
          description: 轮换成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 注销当前会话
      description: 撤销当前刷新令牌链。注销不等于删除账号数据，删除走 `createDeletionRequest`。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已注销。重复调用同样返回成功（幂等）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkLogoutResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/auth/sms/send:
    post:
      operationId: sendSmsChallenge
      tags: [auth]
      summary: 发送短信验证码
      description: |
        医生账号登录（`login-by-account`）的二次校验凭证下发。`challengeId` **一次性**
        （登录成功即作废）；同一手机号 60 秒内不重复下发（`429`）；验证码默认 5 分钟有效、
        连续错 5 次作废。短信网关由服务端选型（`app.sms.provider`）：dev 档只落库并打印
        脱敏日志，生产实现接入后前端不感知；服务端不回显验证码原文。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, scene]
              properties:
                phone: {type: string, pattern: '^1[3-9]\d{9}$', description: 接收验证码的手机号（11 位大陆号码）。}
                scene:
                  type: string
                  enum: [DOCTOR_LOGIN, ACCOUNT_DELETION]
                  description: 使用场景；验证码按场景隔离（N8 医生登录 / N10 账号注销二次校验），不得跨场景复用。
              additionalProperties: false
      responses:
        '200':
          description: 已下发（含按 60s 冷却静默抑制后的可重试语义由 429 表达）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkSmsChallenge'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/v1/doctor/login:
    post:
      operationId: doctorLogin
      x-idempotency: not-required
      tags: [auth]
      summary: 医生端登录
      description: |
        与患者登录同一套令牌机制，但**角色只能由服务端根据数据库中的任职关系判定**，
        请求体里没有角色字段，客户端也无法通过参数提升权限。医生身份需院方预先登记。
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WechatLoginRequest'}
      responses:
        '200':
          description: 登录成功。返回的 `user.roles` 由服务端下发。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/doctor/login-by-account:
    post:
      operationId: doctorLoginByAccount
      tags: [auth]
      summary: 医生账号登录（工号/手机号 + 短信验证码）
      description: |
        design 03-医生登录的单输入框版式：`account` 为**工号或手机号**，`credential` 为
        `POST /api/v1/auth/sms/send` 下发的 6 位验证码 + `challengeId`。
        与微信登录同一套令牌机制（响应同构 `SessionData`）；角色仍只由服务端按
        `doctors` 任职关系判定：验证码有效但账号无医生任职 → `403`。
        `challengeId` 一次性，登录成功即作废；验证码错/过期/已用 → `401`（不区分原因，不泄露存在性）。
        验证码手机号必须与账号绑定手机号一致（工号登录同样校验），否则 `401`。
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorAccountLogin'}
      responses:
        '200':
          description: 登录成功，返回与微信登录同构的会话（`user.roles` 由服务端下发）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ==========================================================================
  # me
  # ==========================================================================

  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [me]
      summary: 当前用户
      description: 返回服务端认定的身份与角色。客户端不得用本地缓存覆盖 `roles` 或 `consents`。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 当前用户。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  # ---------- 个人信息设置扩展（V8，实现见 MeController）----------
  # 登记原则：只描述后端**已实现**的行为。以下四类写操作均为"整体覆盖写"，
  # 服务端未校验 Idempotency-Key（IdempotencyKeys 只在 appointment/consent/家庭成员创建中使用），
  # 因此一律标注 x-idempotency: not-required，而不是声明一个服务端并不兑现的幂等承诺。

  /api/v1/me/extended:
    get:
      operationId: getExtendedProfile
      tags: [me]
      summary: 个人信息扩展资料
      description: |
        返回联系方式与住址明文，以及证件号/医保号的**掩码与绑定状态**。
        证件号与医保号的原文、密文一律不回显；明文只在写入请求里出现一次。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 扩展资料。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkExtendedProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: updateExtendedProfile
      tags: [me]
      summary: 更新联系方式 / 住址 / 户籍
      description: |
        逐字段覆盖写：字段缺省或显式 `null` 表示**保留原值**，不是清空。
        同载荷重复提交得到同一终态，因此不要求幂等键。
      x-idempotency: not-required
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtendedProfileUpdate'}
      responses:
        '200':
          description: 更新后的扩展资料。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkExtendedProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/me/identity:
    post:
      operationId: bindIdentity
      tags: [me]
      summary: 身份证实名绑定
      description: |
        服务端按 GB 11643 校验 18 位号码与校验码，通过后**密文落库**，
        本接口只回掩码与 `idCardVerified`。同一用户再次提交为覆盖写（同证件 → 同一终态）。
      x-idempotency: not-required
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityBind'}
      responses:
        '200':
          description: 绑定后的扩展资料（含掩码与验证状态）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkExtendedProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/me/insurance:
    post:
      operationId: bindInsurance
      tags: [me]
      summary: 医保绑定
      description: |
        医保类型受枚举约束，医保号仅存密文、只回掩码与 `insuranceBound`。
        重复提交为覆盖写。
      x-idempotency: not-required
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InsuranceBind'}
      responses:
        '200':
          description: 绑定后的扩展资料。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkExtendedProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/me/account:
    put:
      operationId: updateAccount
      tags: [me]
      summary: 更新账号基本信息（姓名）
      description: |
        只改账号层基本信息（当前仅 `displayName`），与健康档案 `PATCH /me/profile` 分离。
        返回更新后的契约 `User`，客户端据此刷新本地展示名。覆盖写，幂等。
      x-idempotency: not-required
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountUpdate'}
      responses:
        '200':
          description: 更新后的当前用户。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/me/avatar:
    post:
      operationId: uploadAvatar
      tags: [me]
      summary: 上传头像
      description: |
        `multipart/form-data`，part 名固定为 `file`（不是 `avatar`）。
        成功返回更新后的契约 `User`，`avatarUrl` 为站内相对路径
        （`/api/v1/avatars/{name}`），客户端须拼接网关基址后再展示。
        每次上传生成新文件名，旧文件由服务端回收；因此不是"同一请求同一结果"，
        不承诺幂等。
      x-idempotency: not-required
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 头像图片；格式与大小上限以服务端配置为准，超限返回 `413`。
      responses:
        '200':
          description: 更新后的当前用户（`avatarUrl` 指向新文件）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/consents:
    get:
      operationId: listConsents
      tags: [me]
      summary: 同意记录列表
      description: 返回当前用户各处理目的的同意状态与政策版本。撤回记录同样返回，不原地覆盖。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 同意记录。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkConsentRecordList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: grantConsent
      tags: [me]
      summary: 记录一项同意
      description: |
        系统权限同意（如"允许录音"）不等于敏感个人信息单独同意。本接口记录的是**处理目的**
        维度的单独同意，必须由用户在独立界面主动确认，且携带用户实际看到的政策版本。
        政策版本升级后旧同意不自动延续。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentGrantRequest'}
      responses:
        '200':
          description: 同意已记录。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkConsentRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/consents/{purpose}/withdraw:
    post:
      operationId: withdrawConsent
      tags: [me]
      summary: 撤回一项同意
      description: |
        撤回立即生效并触发下游后果：相关缓存失效、进行中的 AI 任务终止、依赖该同意的
        数据进入删除流程。撤回记录不可删除，仅可追加。
      parameters:
        - name: purpose
          in: path
          required: true
          description: 处理目的，取值与 `ConsentPurpose` 一致。
          schema: {$ref: '#/components/schemas/ConsentPurpose'}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 200, description: 可选的撤回原因，仅用于运营分析，不影响撤回效力。}
      responses:
        '200':
          description: 已撤回。重复撤回返回同一终态（幂等）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkConsentRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/me/deletion-requests:
    post:
      operationId: createDeletionRequest
      tags: [me]
      summary: 提交删除/注销申请
      description: |
        异步工作流，返回受理状态而非"已删除"。法定保留例外（如诊疗记录留存义务）必须
        在响应中逐项说明范围与依据，不能以"已全部删除"笼统表述。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeletionRequestCreate'}
      responses:
        '200':
          description: 申请已受理。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDeletionRequest'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/me/deletion-requests/{requestId}:
    get:
      operationId: getDeletionRequest
      tags: [me]
      summary: 查询删除申请进度
      parameters:
        - name: requestId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 申请状态。他人的申请一律返回 `404`，不返回 `403`。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDeletionRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ---------- 账号注销 / 授权撤回（N10/N11，2026-10-19）----------

  /api/v1/user/account:
    delete:
      operationId: deleteAccount
      tags: [me]
      summary: 账号注销（软删 + 30 天冷静期）
      description: |
        design 10 系统设置红色入口。**红线：软删**——`users.status=DELETION_PENDING` +
        `deletion_requested_at / deletion_effective_at`（冷静期 30 天），**不物理删库**；
        当前会话链立即撤销，冷静期内该账号不可再次登录（403）。

        二次校验：请求体携带 N9 短信验证码（`scene=ACCOUNT_DELETION` 的 `challengeId` + `code`），
        验证码手机号必须是账号绑定手机号；缺失/错误/过期 → `422`（需先获取验证码）。

        未完成业务 → `409`（前端引导先处理）：预约 `PENDING/CONFIRMED/CHECKED_IN`，
        或问诊 `ACTIVE` 且 24 小时内有消息（问诊无关闭端点，以时间窗判定"进行中"，
        避免历史问诊永久阻塞注销——口径显式登记于此）。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountDeletionVerify'}
      responses:
        '200':
          description: 已受理注销（软删进入 30 天冷静期，当前会话已撤销）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAccountDeleted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/user/auth/revoke:
    post:
      operationId: revokeAuthorization
      tags: [me]
      summary: 撤回授权同意
      description: |
        design 10 系统设置「撤回授权同意」。按 scope 撤回对应处理目的的同意
        （`PROFILE→PRIVACY_POLICY`、`HEALTH_RECORDS→HEALTH_DATA_PROCESSING`、
        `FAMILY→FAMILY_PROXY`），同意记录**只追加 WITHDRAWN 行**（不原地覆盖）。

        红线：撤回后服务端**停止**该目的下的后续处理（已建立门禁的处理路径即时生效，
        如报告 AI 解读在 HEALTH_RECORDS 撤回后返回 422）；**已合法收集的数据不主动删除**。
        从未授意的 scope 撤回为幂等终态（同样返回 `revoked:true`，不报错）。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthRevokeRequest'}
      responses:
        '200':
          description: 撤回已生效（幂等终态）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAuthRevoked'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  # ==========================================================================
  # catalog
  # ==========================================================================

  /api/v1/hospitals:
    get:
      operationId: listHospitals
      tags: [catalog]
      summary: 院区列表
      description: |
        供挂号页顶部「本院区▾」筛选（效果图对齐，N7）。院区**由 ACTIVE 科室归属去重派生**
        （无科室归属的院区不可知，不臆造）；名称取 `departments.hospital_name`，
        历史行缺失时按 hospital_id 归一（与科室列表同一口径）。匿名只读。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 院区列表（可能为空数组）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkHospitalList'}

  /api/v1/departments:
    get:
      operationId: listDepartments
      tags: [catalog]
      summary: 科室列表
      description: 只读目录。前端不得内置科室清单作为权威数据，只能缓存展示。
      parameters:
        - name: hospitalId
          in: query
          required: false
          schema: {type: string, maxLength: 64}
        - name: keyword
          in: query
          required: false
          schema: {type: string, maxLength: 40}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 科室列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDepartmentList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/departments/{departmentId}/doctors:
    get:
      operationId: listDepartmentDoctors
      tags: [catalog]
      summary: 科室下的医生
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - name: date
          in: query
          required: false
          description: 只返回该日期有号的医生；缺省表示不按日期过滤。
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 医生列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDoctorList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/doctors:
    get:
      operationId: listDoctors
      tags: [catalog]
      summary: 医生列表（全量/按医院筛选）
      description: |
        兼容层 `/api/v1/doctor/list`、`/api/v1/doctor/by-department` 的实际翻译目标；
        此前只在实现中存在、契约未登记（docs/前端数据依赖与后端接口需求_20261017.md §5.2）。
        与 `{departmentId}/doctors` 同源同形，匿名只读。
      parameters:
        - name: hospitalId
          in: query
          required: false
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 医生列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDoctorList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/doctors/{doctorId}/slots:
    get:
      operationId: listDoctorSlots
      tags: [catalog]
      summary: 医生号源
      description: |
        `remaining` 是某一时刻的快照，**不构成预留**。真正的可用性以 `createAppointment`
        的原子扣减结果为准；下单失败必须回退到本接口重新取号，不得沿用旧快照。
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - name: from
          in: query
          required: false
          schema: {type: string, format: date}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 号源列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkSlotList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  # ---------- 院内导航数据（N17，2026-10-19，P3）----------

  /api/v1/indoor-map/floors:
    get:
      operationId: listIndoorFloors
      tags: [catalog]
      summary: 楼层平面图列表
      description: |
        服务端下发楼层清单（与前端 `packageNav/data/indoor-map.js` 同源数据），
        接口落地后前端无缝切换；本地数据仍可演示。匿名只读。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 楼层列表（可能为空数组）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkIndoorFloorList'}

  /api/v1/indoor-map/route:
    get:
      operationId: getIndoorRoute
      tags: [catalog]
      summary: 院内路径规划
      description: |
        按服务端平面图数据计算 `from → to` 路径（坐标为底图百分比，与前端画布同源）。
        数据内路径经由医院大门（ORIGIN）连通：大门↔目的地为直达段，目的地↔目的地为
        经大门两段拼接。`from`/`to` 不存在 → 404；不臆造不可达路径。
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, maxLength: 64, description: 起点节点 ID（如 gate 或目的地 ID）。}
        - name: to
          in: query
          required: true
          schema: {type: string, maxLength: 64, description: 终点节点 ID。}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 路径（折线点 + 分步指引 + 距离）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkIndoorRoute'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ==========================================================================
  # appointment
  # ==========================================================================

  /api/v1/appointments:
    post:
      operationId: createAppointment
      tags: [appointment]
      summary: 创建预约
      description: |
        正确性由 **数据库唯一约束 + 原子扣号 + 事务** 保证；Redis 锁只是性能优化，
        不得作为唯一防线。

        幂等语义：同一 `Idempotency-Key` 重复提交且载荷一致时，返回**首次的最终结果**
        （含被拒的结果），不重复扣号；同一键但载荷不同返回 `409`。号源已满返回 `409`
        并在 `details` 中给出 `slotId`，客户端应回退到号源列表重新选择。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentCreate'}
      responses:
        '200':
          description: |
            预约已创建，或为该幂等键的首次结果重放。客户端不得依据 `200` 推断"本次是新建"，
            应读 `data.replayed`。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAppointment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/v1/appointments/me:
    get:
      operationId: listMyAppointments
      tags: [appointment]
      summary: 我的预约
      description: |
        永远以服务端身份范围过滤，不接受客户端传入 `patientId`/`userId`。范围过滤必须
        发生在查询条件里，不能只在返回前过滤列表。
      parameters:
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/AppointmentStatus'}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 本人预约列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAppointmentList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/appointments/by-idempotency-key/{key}:
    get:
      operationId: getAppointmentByIdempotencyKey
      tags: [appointment]
      summary: 按幂等键查询预约最终状态
      description: |
        创建预约超时或网络中断后的恢复路径。只返回**当前用户**在该键下创建的记录，
        键本身不构成读取凭证。
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 该键对应的预约。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAppointment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/appointments/{appointmentId}/cancel:
    post:
      operationId: cancelAppointment
      tags: [appointment]
      summary: 取消预约
      description: 状态机驱动：只有允许取消的状态才接受取消。重复取消返回同一终态而非报错。
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 200}
      responses:
        '200':
          description: 取消后的预约。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAppointment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/appointments/{appointmentId}:
    delete:
      operationId: deleteAppointment
      tags: [appointment]
      summary: 删除（取消）预约
      description: |
        患者侧删除预约：语义与 POST .../cancel 一致（状态机驱动 + 幂等 + 号源回补）。
        仅当前用户资源（他人 404）；已处 CANCELLED 等终态 → 200 同终态；
        不可取消状态（如 CHECKED_IN/COMPLETED）→ 409。
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 取消后的预约。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAppointment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # ==========================================================================
  # patient
  # ==========================================================================

  /api/v1/health-records:
    get:
      operationId: listHealthRecords
      tags: [patient]
      summary: 健康档案列表
      parameters:
        - name: familyMemberId
          in: query
          required: false
          description: 家庭代理场景；服务端必须校验当前用户对该成员的有效授权，否则返回 `404`。
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 档案列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkHealthRecordList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createHealthRecord
      tags: [patient]
      summary: 新增健康档案
      description: 只收集功能确需的字段；字段必要性由医疗与法律分别确认。附件走上传意图 + 短期签名 URL，不在此接口内联传输。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HealthRecordCreate'}
      responses:
        '200':
          description: 建档结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkHealthRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  # ---------- 健康档案附件（V9 · 2026-10-18）----------
  # 两段式上传：先 POST /api/v1/attachments 拿 objectKey（暂存），建档时以
  # HealthRecordCreate.attachmentKeys 挂载；或对既有档案直接
  # POST /api/v1/health-records/{recordId}/attachments 上传即挂载。
  # ⚠️ 路径字面量 /attachments 与 /attachments/{objectKey} 不冲突（集合 POST vs 条目 GET）。
  /api/v1/attachments:
    post:
      operationId: uploadAttachment
      tags: [patient]
      summary: 上传检查资料（暂存，产出 objectKey）
      description: |
        `multipart/form-data`，part 名固定为 `file`。返回 objectKey 与元数据（含短期签名 URL）。
        objectKey 供建档时以 `HealthRecordCreate.attachmentKeys` 挂载；暂存文件不与任何档案关联，
        弃用会留孤儿文件（V1 已知限制，运维定期清理）。
        格式与大小：≤10MB，jpg/jpeg/png/webp/pdf；超限 `413`，格式不符 `415`。
      x-idempotency: not-required
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 检查资料文件；格式与大小上限以服务端配置为准。
      responses:
        '200':
          description: 上传结果（objectKey + 元数据 + 短期签名 URL）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAttachment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/attachments/{objectKey}:
    get:
      operationId: readAttachment
      tags: [patient]
      summary: 读取附件（匿名 + 短期签名 URL）
      description: |
        匿名可访问（`<image>` 组件直连无法携带 Authorization；签名即鉴权）。
        URL 必须携带 `expires`（unix 秒）与 `sig`（HMAC-SHA256(secret, objectKey + "|" + expires)），
        TTL 默认 15 分钟。过期 `410`、签名不符 `403`、文件不存在 `404`。
        档案列表/详情响应中的 `attachments[].url` 即此类签名 URL，过期后重新拉取档案即得新 URL。
      security: []
      parameters:
        - name: objectKey
          in: path
          required: true
          description: 服务端生成的文件名（32 位 hex + 白名单扩展名）。
          schema: {type: string, pattern: '^[0-9a-f]{32}\.(jpg|jpeg|png|webp|pdf)$'}
        - name: expires
          in: query
          required: true
          description: 过期时间（unix 秒）。
          schema: {type: integer}
        - name: sig
          in: query
          required: true
          description: HMAC-SHA256 签名（hex）。
          schema: {type: string}
      responses:
        '200':
          description: 文件二进制（Content-Type 按扩展名）。
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410':
          description: 签名 URL 已过期；重新拉取档案获取新 URL。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}

  /api/v1/health-records/{recordId}/attachments:
    get:
      operationId: listRecordAttachments
      tags: [patient]
      summary: 档案附件列表（含短期签名 URL）
      description: 不存在/越权 → `404`（不泄露存在性）。`url` 可能已过期，过期时重新拉取。
      parameters:
        - name: recordId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 附件列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAttachmentList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: uploadRecordAttachment
      tags: [patient]
      summary: 上传附件并挂到既有档案
      description: |
        `multipart/form-data`，part 名固定为 `file`。先校验档案归属（含家庭成员
        GRANTED 代理授权），再落盘 + 插行，返回带短期签名 URL 的附件元数据。
        格式与大小同暂存上传（≤10MB，jpg/jpeg/png/webp/pdf）。
      x-idempotency: not-required
      parameters:
        - name: recordId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 附件元数据（含短期签名 URL）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAttachment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}

  /api/v1/health-records/{recordId}/attachments/{attachmentId}:
    delete:
      operationId: deleteRecordAttachment
      tags: [patient]
      summary: 删除附件
      description: 不存在/越权 → `404`。物理删除文件与行；前端负责二次确认。
      x-idempotency: not-required
      parameters:
        - name: recordId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - name: attachmentId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 删除成功（data 为 null）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkEmpty'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}


  /api/v1/health-records/{recordId}/interpret:
    post:
      operationId: interpretHealthRecord
      tags: [patient]
      summary: 报告 AI 解读
      description: |
        对单条健康档案（通常是检验/检查报告）生成**面向患者的通俗解释**。
        属医疗建议边界，服务端必须在响应里携带免责声明，客户端必须原样展示。

        ⚠️ 红线：解读结果**不得给出诊断结论、用药剂量或处方**；不得修改原记录内容。
        ⚠️ 幂等：同一 `Idempotency-Key` 重复请求应返回首次结果，不重复计费、不重复生成。
        ⚠️ 未就绪：报告尚在 `PENDING/REVIEWING` 时返回 `422`，客户端显示「报告尚未出具」。
        422 同样覆盖：不支持的 `scope`，以及 HEALTH_DATA_PROCESSING 同意**已撤回**（N11）——
        撤回即停止处理，客户端引导到设置重新授权。

        客户端口径：本接口未实现前返回 501，前端必须显示可见的降级提示，
        **不得**用本地假数据冒充解读结果（违反"禁止伪造业务数据"红线）。
      parameters:
        - name: recordId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InterpretationRequest'}
      responses:
        '200':
          description: 解读结果（可能仍在生成，见 `data.status`）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkInterpretation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/family-members:
    get:
      operationId: listFamilyMembers
      tags: [patient]
      summary: 家庭成员列表
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 成员列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkFamilyMemberList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createFamilyMember
      tags: [patient]
      summary: 添加家庭成员
      description: 添加不等于获得代理权限；代理权限需经成员本人或被授权监护人确认后由服务端生效。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FamilyMemberCreate'}
      responses:
        '200':
          description: 成员已添加。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkFamilyMember'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  # 单成员路径（实现见 PatientController）：GET/PATCH/DELETE 三个方法均已在后端落地。
  # ⚠️ 字面量路径 /family-members/invitations 必须优先于本路径匹配（Spring 按字面量优先）。
  /api/v1/family-members/{memberId}:
    get:
      operationId: getFamilyMember
      tags: [patient]
      summary: 家庭成员详情
      description: 只返回当前用户名下的成员；"不存在"与"不属于当前用户"同样返回 `404`，不泄漏存在性。
      parameters:
        - name: memberId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 成员资料。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkFamilyMember'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateFamilyMember
      tags: [patient]
      summary: 更新家庭成员资料
      description: |
        逐字段更新，缺省字段保留原值。**不含 `proxyStatus`**——代理权限只能由成员确认或撤回，
        客户端不得通过本接口自授权。服务端宽松接收未知字段（忽略而非 422）。
      x-idempotency: not-required
      parameters:
        - name: memberId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FamilyMemberUpdate'}
      responses:
        '200':
          description: 更新后的成员资料。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkFamilyMember'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteFamilyMember
      tags: [patient]
      summary: 删除家庭成员
      description: |
        解除本人对该成员的代管关系与档案可见性。重复删除返回同一终态（`data: null`），
        因此不要求幂等键。
      x-idempotency: not-required
      parameters:
        - name: memberId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已删除，`data` 为 `null`。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkEmpty'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/family-members/invitations:
    get:
      operationId: listFamilyInvitations
      tags: [patient]
      summary: 我发出的家庭成员邀请
      description: |
        只回邀请元数据；token/tokenHash/phoneHash 一律不下发（令牌仅在创建响应出现一次）。
        修复 §2.4：字面量路径曾被 `GET /family-members/{memberId}` 吞掉返回 404。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 邀请列表（新的在前）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkFamilyInvitationSummaryList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createFamilyInvitation
      tags: [patient]
      summary: 发起家庭成员绑定邀请
      description: 邀请令牌有时效且一次性；令牌不得包含明文身份信息，服务端只保存哈希。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relation]
              properties:
                relation: {type: string, maxLength: 20, description: 关系标签，由前端枚举下发，不作为权限依据。}
                channel: {type: string, enum: [QRCODE, PHONE_DEEPLINK], description: 邀请分发渠道。}
                phone: {type: [string, 'null'], maxLength: 20, description: 可选；若提供则仅以哈希保存用于比对，不回显原文。}
      responses:
        '200':
          description: 邀请已创建。返回的令牌只在此次响应中出现。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkFamilyInvitation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ==========================================================================
  # consultation
  # ==========================================================================

  /api/v1/consultations:
    get:
      operationId: listConsultations
      tags: [consultation]
      summary: 我的问诊会话
      description: 返回元数据与摘要，不返回完整消息正文；正文按会话单独拉取。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 会话列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkConsultationList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    post:
      operationId: createConsultation
      tags: [consultation]
      summary: 创建问诊会话并发起首个 AI 任务
      description: |
        返回会话与任务两个对象。任务进入 `QUEUED`，结果通过 `GET /api/v1/ai/tasks/{taskId}/events`
        或轮询 `GET /api/v1/ai/tasks/{taskId}` 获得。

        **急症优先**：若输入命中红线症状，本接口先返回安全提示（`data.safety.emergency = true`），
        生成结果不阻塞该提示的展示，也不得让用户等待模型输出来决定是否就医。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsultationCreate'}
      responses:
        '200':
          description: 会话与任务已创建。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkConsultationCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/consultations/{consultationId}:
    get:
      operationId: getConsultation
      tags: [consultation]
      summary: 会话详情与消息
      parameters:
        - name: consultationId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 会话与其消息（分页）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkConsultation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/consultations/{consultationId}/messages:
    get:
      operationId: listConsultationMessages
      tags: [consultation]
      summary: 拉取会话消息正文
      description: |
        `GET /api/v1/consultations` 只返回元数据与摘要，正文须由本接口单独拉取
        （2026-10-19 补齐：原契约只有发送端，重进会话后无法恢复历史消息，
         导致「在线问诊」页面只能显示当次会话内容）。
        按 `createdAt` 升序返回，支持游标分页。不存在或越权 → `404`（不泄露存在性）。
      parameters:
        - name: consultationId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 消息列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkMessageList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: sendConsultationMessage
      tags: [consultation]
      summary: 发送消息
      description: |
        用户消息先落库（权威记录在 MySQL），再创建 AI 任务。生成失败不影响用户消息的
        持久化，客户端应能看到自己发出的内容并重试生成。
      parameters:
        - name: consultationId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageCreate'}
      responses:
        '200':
          description: 消息已保存并已创建生成任务。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkMessageSent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/consultations/{consultationId}/confirmations:
    post:
      operationId: confirmConsultationInput
      tags: [consultation]
      summary: 确认转写或结构化输入
      description: |
        语音转写与图片识别结果在进入诊疗相关流程前必须由用户核对确认，尤其是症状、
        药品、剂量和时间。未确认的转写只能作为草稿存在，不得据此生成结论。
      parameters:
        - name: consultationId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InputConfirmation'}
      responses:
        '200':
          description: 已确认。若来源任务仍在运行，服务端应终止其后续生成。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkMessage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  # ==========================================================================
  # ai-task
  # ==========================================================================

  /api/v1/ai/tasks/{taskId}:
    get:
      operationId: getAiTask
      tags: [ai-task]
      summary: 查询 AI 任务状态与结果
      description: |
        **断线恢复的权威路径。** SSE 连接中断、页面重进、超时之后，一律回到本接口取终态；
        绝不允许把"连接断了"当成成功，也不允许用 `QUEUED` 无限轮询掩盖失败。
        任务终态为 `SUCCEEDED | FAILED | CANCELLED | EXPIRED`。
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 任务状态。`data.result` 仅在 `SUCCEEDED` 时出现。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAiTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    delete:
      operationId: cancelAiTask
      x-idempotency: not-required
      tags: [ai-task]
      summary: 取消 AI 任务
      description: |
        尽力取消：服务端向下游传递取消信号，但已产生的部分结果不回滚。状态转换幂等——
        对已处于终态的任务重复调用返回同一终态，不报错。
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 取消后的任务终态。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAiTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/ai/tasks/{taskId}/events:
    get:
      operationId: streamAiTaskEvents
      tags: [ai-task]
      summary: 订阅 AI 任务事件流（SSE）
      description: |
        `text/event-stream`。事件类型固定为
        `accepted` `status` `delta` `citation` `safety` `tts` `completed` `cancelled` `error`，
        载荷结构见 `AiTaskEvent`。

        流**只是增量通道**：收到 `completed` 后客户端仍需以 `GET /api/v1/ai/tasks/{taskId}`
        的终态为准，避免丢帧导致的半截内容被当成完整结果。服务端不得伪造模型不提供的
        精确进度百分比，`progressPhase` 只能是阶段名。
      parameters:
        - name: taskId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - name: Last-Event-ID
          in: header
          required: false
          description: 断线续传游标。服务端可据此补发，但补发失败时客户端必须回退到状态轮询。
          schema: {type: string, maxLength: 128}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 事件流。每个事件为 `id:` + `event:` + `data:`(JSON `AiTaskEvent`)。
          headers:
            Cache-Control:
              schema: {type: string, const: 'no-store'}
            X-Accel-Buffering:
              description: 反向代理必须关闭缓冲，否则事件会被攒到最后一次性下发。
              schema: {type: string, const: 'no'}
          content:
            text/event-stream:
              schema: {type: string, description: SSE 帧文本；`data:` 部分为 `AiTaskEvent` 的 JSON 序列化。}
              example: |
                id: 41
                event: delta
                data: {"taskId":"t_1","seq":41,"type":"delta","text":"建议先补充","occurredAt":"2026-10-14T10:30:02+08:00"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ==========================================================================
  # triage
  # ==========================================================================

  /api/v1/triage/recommendations:
    post:
      operationId: recommendDepartment
      tags: [triage]
      summary: 推荐就诊科室
      description: |
        服务端编排：本地红旗规则先跑，远端模型只做补充。**已命中的本地红旗等级不得被
        远端结果降低。** 响应必须区分 `RULE_RESULT` 与 `AI_GENERATED` 来源，且只给
        科室建议与就医指引，不给诊断。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TriageRequest'}
      responses:
        '200':
          description: 导诊建议。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkTriageResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/triage/emergency-checks:
    post:
      operationId: checkEmergency
      x-idempotency: not-required
      tags: [triage]
      summary: 急症信号检查
      description: |
        轻量、快速、无生成的端点，供页面在输入过程中调用。红线词表与阈值属医疗审核内容
        （待决事项 O-07），当前仅为占位契约。客户端**必须**保留本地规则做断网兜底：
        本接口失败时不得让急症提示消失。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, maxLength: 500}
                locale: {type: string, maxLength: 20, default: zh-CN}
      responses:
        '200':
          description: 检查结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkEmergencyCheck'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  # ==========================================================================
  # care-plan
  # ==========================================================================

  /api/v1/care-plans:
    post:
      operationId: createCarePlan
      tags: [care-plan]
      summary: 生成养生/照护建议
      description: |
        输出定位为**生活方式与膳食参考**，不得表述为处方、治疗方案或用药指导。
        响应中的每条建议都必须带来源标识与边界提示；证据不足时返回结构化拒答，
        不得用通用养生话术填充。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CarePlanRequest'}
      responses:
        '200':
          description: '照护建议。幂等重放时响应头带 Idempotency-Replayed: true。'
          headers:
            Idempotency-Replayed:
              description: 同键同载荷重放时为 `true`；首次执行不返回该头。
              schema: {type: string, enum: ['true']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkCarePlan'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  # ==========================================================================
  # message（消息中心，V21 医生-患者互通）
  # ==========================================================================

  /api/v1/messages:
    get:
      operationId: listMessages
      tags: [message]
      summary: 消息列表（分页）
      description: |
        当前用户消息中心列表。支持 `read` 过滤（true/false/all）与 keyset 游标分页。
        消息类型 `type`：APPOINTMENT（挂号状态变更通知）· SYSTEM（系统通知）。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: read
          in: query
          required: false
          schema: {type: string, enum: [all, true, false], default: all}
          description: all=全部 / true=仅已读 / false=仅未读。
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 消息列表（含 keyset 下一页游标）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkMessageCenterList'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/messages/unread-count:
    get:
      operationId: getUnreadCount
      tags: [message]
      summary: 未读消息数
      responses:
        '200':
          description: 未读数（红点）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkMessageUnreadCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/messages/{messageId}/read:
    post:
      operationId: markMessageRead
      tags: [message]
      summary: 标记消息已读
      description: 幂等：重复标记同一消息仍为 200；消息不存在或非本人同样返回 200（不泄露存在性）。
      x-idempotency: not-required
      parameters:
        - name: messageId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 标记成功。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkMessageCenter'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ==========================================================================
  # voice
  # ==========================================================================

  /api/v1/voice/asr:
    post:
      operationId: recognizeSpeech
      tags: [voice]
      summary: 语音识别
      description: |
        本地 `qwen3-asr-0.6b`，音频不出服务器。识别文本**必须由用户确认后**才能进入
        诊疗相关流程（见 `confirmConsultationInput`）。

        默认不保存音频与识别文本；音频在受控临时目录中于任务结束后清理。
        繁忙或超时分别返回 `ASR_BUSY` / `ASR_TIMEOUT`，客户端保留重录与文字输入，
        不得自动改走第三方云 ASR。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: {type: string, format: binary, description: 16kHz 单声道；服务端负责转码与校验，不信任客户端声明的格式。}
                durationMs: {type: integer, minimum: 1, maximum: 60000, description: 客户端声明时长，仅用于提前拒绝，服务端仍需自行测量。}
                locale: {type: string, maxLength: 20, default: zh-CN}
                consultationId: {type: [string, 'null'], maxLength: 64}
      responses:
        '200':
          description: 识别结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAsrResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}

  /api/v1/voice/tts:
    post:
      operationId: synthesizeSpeech
      tags: [voice]
      summary: 语音合成
      description: |
        合成由**服务端配置的适配器**承担，实际引擎在 `engine` 字段中如实返回。两种情形
        都必须注意：

        - 若使用 `edge-tts`，它是**联网第三方库**，不是本项目购买并受 SLA 约束的 Azure
          正式商业 API，可用性、音色列表与数据处理方式都可能变化；
        - 不论使用哪种引擎，客户端都不得据 `engine` 值宣称任何 SLA，也不得把本地或
          第三方实现描述成 Azure 正式商业服务。

        无论引擎为何：

        - 文本在送出前先脱敏（姓名、手机号、证件号、病历号等）；
        - 失败返回 `TTS_UNAVAILABLE`，页面保留文字，不播放占位音频，不阻断对话；
        - 响应不内联音频字节，而是返回短期签名 URL，命中缓存时同样返回 URL 并置 `cached: true`。

        **缓存键**对引擎版本、音色、语速、格式、规范化文本与隐私作用域做 HMAC-SHA-256；
        规范化不得改变医学含义。

        ⚠️ 引擎取值与仓库当前实现不一致（待决事项 O-10），迁移前不得按本段的引擎假设
        去改客户端。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TtsRequest'}
      responses:
        '200':
          description: 合成结果（音频以短期签名 URL 交付）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkTtsResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}

  /api/v1/voice/voices:
    get:
      operationId: listVoices
      tags: [voice]
      summary: 可用音色
      description: 音色列表可能来自第三方且随时变化，客户端必须容忍未知值并回退到默认音色，不得把列表写死在包里。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 音色列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkVoiceList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    post:
      operationId: saveVoicePreference
      tags: [voice]
      summary: 保存自定义音色偏好
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VoicePreference'}
      responses:
        '200':
          description: 已保存。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkVoice'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/voice/voices/default:
    get:
      operationId: getDefaultVoice
      tags: [voice]
      summary: 默认音色
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 默认音色。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkVoice'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
    put:
      operationId: setDefaultVoice
      tags: [voice]
      summary: 设默认音色（覆盖当前账号的音色偏好）
      description: |
        语义明确为"覆盖账号级默认音色"，换机后随账号恢复；与 `POST /voices` 同义，
        保留 POST 仅为兼容旧客户端（docs/前端数据依赖与后端接口需求_20261017.md §4.4）。
        覆盖写：同 body 重复提交得到同一终态，服务端未校验幂等键。
      x-idempotency: not-required
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VoicePreference'}
      responses:
        '200':
          description: 已保存。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkVoice'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/voice/voices/{voiceId}:
    delete:
      operationId: deleteVoice
      x-idempotency: not-required
      tags: [voice]
      summary: 删除自定义音色
      parameters:
        - name: voiceId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已删除（幂等：不存在的音色同样返回成功，避免探测他人音色 ID）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDeleted'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/voice/voices/{voiceId}/previews:
    post:
      operationId: previewVoice
      x-idempotency: not-required
      tags: [voice]
      summary: 试听音色
      description: 使用固定、非敏感的示例文本试听，不接受任意文本，避免把试听接口变成任意合成通道。
      parameters:
        - name: voiceId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 试听音频（短期签名 URL）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkTtsResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/v1/voice/models:
    get:
      operationId: listVoiceModels
      tags: [voice]
      summary: 可用语音模型与能力状态
      description: |
        返回**能力状态**而非承诺：`available` / `degraded` / `unavailable`。
        模型权重缺失时这里如实反映，客户端据此隐藏或禁用相应入口，而不是等到调用才失败。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 模型清单与能力状态。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkVoiceModelList'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  # ==========================================================================
  # content
  # ==========================================================================

  # ---------- 健康科普（N12/N13，2026-10-19）----------

  /api/v1/health-articles:
    get:
      operationId: listHealthArticles
      tags: [content]
      summary: 科普文章列表（分页 + 分类 + 搜索）
      description: |
        服务端下发动态科普内容（分类/搜索/游标分页），替代仅靠本地
        `utils/knowledge-kb.js` 的静态清单；本地 KB 仍是**离线降级**，列表为空或
        不可用时前端降级到本地内容并显式提示，不伪造服务端数据。
        封面 `coverUrl` 为 Attachment 签名 URL（HMAC 短 TTL）；缺失时前端不渲染封面占位图以外的内容。
      parameters:
        - name: category
          in: query
          required: false
          schema: {type: string, maxLength: 32, description: 分类筛选（如 sleep/digest 等运营分类键）。}
        - name: type
          in: query
          required: false
          schema: {type: string, enum: [article, video]}
        - name: kw
          in: query
          required: false
          schema: {type: string, maxLength: 40, description: 标题/摘要关键词搜索。}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 文章列表（可能为空数组）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkArticleList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/health-articles/{articleId}:
    get:
      operationId: getHealthArticle
      tags: [content]
      summary: 科普文章详情（分节正文 + tip + 封面）
      description: 不存在或未上架一律 404；`sections` 分节正文、`tip` 为小贴士、`related[]` 为相关文章 ID。
      parameters:
        - name: articleId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 文章详情。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkArticle'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/contents:
    get:
      operationId: listContents
      tags: [content]
      summary: 健康科普列表
      description: 只返回已通过医疗审核且在有效期内的内容；草稿、过期与已撤回内容不得出现在列表里。
      parameters:
        - name: category
          in: query
          required: false
          schema: {type: string, maxLength: 40}
        - name: keyword
          in: query
          required: false
          schema: {type: string, maxLength: 60}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 内容列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkContentList'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/contents/{contentId}:
    get:
      operationId: getContent
      tags: [content]
      summary: 科普详情
      parameters:
        - name: contentId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 内容详情，含来源、审核状态与生效期。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/resources/manifest:
    get:
      operationId: getResourceManifest
      tags: [content]
      summary: 客户端资源清单
      description: |
        返回远侧资源的版本、ETag、SHA-256、MIME、大小、关键级与过期信息，客户端据此
        后台更新可缓存资源。**清单损坏或不可用时，客户端必须以内置资源继续运行**——
        图片、图标或清单失败不得阻断启动、登录与业务 API。

        禁止通过本清单下发可执行 JS/WXML 或未签名的安全规则（如红旗词表）。
      parameters:
        - name: platform
          in: query
          required: false
          schema: {type: string, const: wechat-miniprogram}
        - name: clientVersion
          in: query
          required: false
          schema: {type: string, maxLength: 20}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 资源清单。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkResourceManifest'}
        '304':
          description: 清单未变化（配合 `If-None-Match`）。
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  # 单资源读取：清单 items[].url 的目标，也是清单未配 public-base-url 时客户端的直取通道。
  # 与 /manifest 的关系：清单负责"有哪些、什么时候换"，本端点负责"把字节取回来"。
  /api/v1/resources/{key}:
    get:
      operationId: readResource
      tags: [content]
      summary: 按 key 读取资源二进制（匿名）
      description: |
        匿名可访问：`<image>` / `wx.downloadFile` 无法携带 Authorization，而资源本身是
        公开的图标与插画（无隐私属性），故与 `/manifest` 同属 `AuthInterceptor` 匿名白名单。
        选"匿名直取"而非"HMAC 签名 URL"：签名会让 URL 每次都变，从而丢掉 `ETag`/`304`
        与 7 天 `Cache-Control` 的收益；私密文件走 `/api/v1/attachments/{objectKey}` 的签名通道。

        响应头：`Content-Type` 取库内 `mime_type`（不统一 octet-stream，否则微信端不渲染）、
        显式 `Content-Length`、`ETag` = sha256、`Cache-Control` public（图片 7 天 / 视频 1 天）。
        只暴露 `status=1` 的资源；停用与不存在一律 `404`（不泄露存在性）。

        客户端缓存注意：微信按 URL 缓存图片，远端内容替换后建议在 URL 追加内容指纹
        （如 `?v={sha256 前 12 位}`），否则旧图最多残留 7 天；服务端忽略未知 query。
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: 资源键，如 `home.xiaoan-robot`、`icons.chat`。
          schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: 资源二进制（Content-Type 取库内 mime）。
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            video/mp4: {schema: {type: string, format: binary}}
        '304':
          description: 资源未变化（配合 `If-None-Match`）。
        '404': {$ref: '#/components/responses/NotFound'}

  # ==========================================================================
  # doctor
  # ==========================================================================

  /api/v1/doctor/me:
    get:
      operationId: getDoctorMe
      tags: [doctor]
      summary: 当前医生自述资料
      description: |
        返回当前登录医生的基本任职信息（科室、职称、工号、姓名、头像），
        供医生端工作台顶部展示与问诊归属使用。无 ACTIVE 任职 → 403。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 医生自述资料。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDoctorProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/doctor/overview:
    get:
      operationId: getDoctorOverview
      tags: [doctor]
      summary: 医生统计概览
      description: |
        工作台/挂号页统计骨架（效果图 01/13），一次取回聚合计数，替代全量拉列表前端聚合。

        计数口径（均按 UTC 日窗口，与 workbench 一致）：`waiting` = 今日已签到候诊
        （CHECKED_IN）、`done` = 今日已完成（COMPLETED）、`todayTotal` = 今日挂号总数、
        `pendingTodos` = `listDoctorTodos` 可判定待办条数。

        ⚠️ `inProgress`（接诊中）：当前挂号状态机 `AppointmentStatus` 无「接诊中」状态，
        服务端**不可判定** → 恒为 `null`，前端不渲染该统计卡（不以 0 冒充）。
        子块独立降级：单个计数失败时该字段为 `null`（同样不渲染），其余字段照常返回。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 统计概览（不可判定/降级字段为 null）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDoctorOverview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/doctor/todos:
    get:
      operationId: listDoctorTodos
      tags: [doctor]
      summary: 医生待处理事项
      description: |
        工作台「待处理事项」卡数据源（效果图 01）。只返回**服务端可判定**的待办，
        不做客户端猜测；空数组表示确实没有待办（客户端展示空态，不得伪造条目）。

        `kind` 语义：`CONSULT_REPLY` 在线问诊待回复 · `CHECKIN_CONFIRM` 预约签到待确认 ·
        `REPORT_REVIEW` 检查报告待审核。
        `route` 由服务端给出跳转目标（含所需参数），客户端**不得自行拼业务路径**；
        为 `null` 时该项不可点击。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 待办列表（可能为空数组）。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkTodoList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}


  /api/v1/doctor/workbench:
    get:
      operationId: getDoctorWorkbench
      tags: [doctor]
      summary: 医生工作台概览
      description: 数据范围限定在登录医生被授权的科室/病区内，由服务端按任职关系裁剪，不接受客户端传入范围参数。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 工作台概览。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDoctorWorkbench'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}

  /api/v1/doctor/appointments:
    get:
      operationId: listDoctorAppointments
      tags: [doctor]
      summary: 医生挂号列表
      parameters:
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/AppointmentStatus'}
        - name: date
          in: query
          required: false
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 挂号列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAppointmentList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/doctor/appointments/{appointmentId}/status:
    post:
      operationId: updateAppointmentStatus
      tags: [doctor]
      summary: 流转挂号状态
      description: |
        状态机驱动，服务端校验合法转换；非法转换返回 `409` 而不是静默忽略。
        每次流转写入 `appointment_status_events`，记录操作者、时间与服务端时间戳。
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toStatus, expectedVersion]
              properties:
                toStatus: {$ref: '#/components/schemas/AppointmentStatus'}
                expectedVersion:
                  type: integer
                  minimum: 1
                  description: 乐观锁版本。不匹配返回 `409`，用于阻止并发覆盖。
                note: {type: string, maxLength: 200}
      responses:
        '200':
          description: '流转后的预约。幂等重放时响应头带 Idempotency-Replayed: true（2026-10-18 D1 与 care-plan 等端点统一）。'
          headers:
            Idempotency-Replayed:
              description: 同键同资源同载荷重放时为 `true`；首次流转不返回该头。
              schema: {type: string, enum: ['true']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAppointment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/doctor/consultations:
    get:
      operationId: listDoctorConsultations
      tags: [doctor]
      summary: 医生问诊会话列表（仅本医生名下 ACTIVE）
      description: |
        V21 医生回复闭环（2026-10-23 实现，2026-10-29 回写契约）：非医生用户 `403`；
        只返回当前医生名下的 ACTIVE 会话，含就诊人姓名/头像（医生端识别就诊人所需），
        不含医生卡字段。cursor 为双键游标（createdAt + id），limit 取 1~50，缺省 20。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 会话列表；`meta.cursor` 非空表示还有下一页。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDoctorConsultationList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/doctor/consultations/{consultationId}/messages:
    get:
      operationId: listDoctorConsultationMessages
      tags: [doctor]
      summary: 医生视角拉取会话消息（旧→新）
      description: |
        仅会话归属医生可见；他人 / 未分配 / 不存在一律 `404`（不泄露存在性）。
        与患者侧 `/consultations/{id}/messages` 同构，返回同一 `Message` 结构。
      parameters:
        - name: consultationId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 消息列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkMessageList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/doctor/consultations/{consultationId}/accept:
    post:
      operationId: acceptDoctorConsultation
      tags: [doctor]
      summary: 认领未分配咨询
      description: |
        未分配 → 绑定当前医生；已归本人 → 幂等重放（`replayed=true`）；
        已归他人或会话已结束 → `409`。响应 `X-Idempotency-Replayed` 头标注是否重放。
      parameters:
        - name: consultationId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 认领结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkConsultationAccept'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/doctor/consultations/{consultationId}/close:
    post:
      operationId: closeDoctorConsultation
      tags: [doctor]
      summary: 结束在线问诊
      description: |
        status → CLOSED，写一条双方可见的 system_notice 并给患者发消息中心通知。
        仅归属医生可结束；已结束 → `409 CONSULTATION_CLOSED`；不存在 / 非本人 → `404`。
      parameters:
        - name: consultationId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 结束结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkConsultationClose'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/consultations/{consultationId}/doctor-reply:
    post:
      operationId: doctorReplyConsultation
      tags: [consultation, doctor]
      summary: 医生回复患者问诊
      description: |
        必须为会话归属医生（否则 `404`，防探测）。消息先独立落库（权威），再写患者消息中心通知。
        重复提交同一 Idempotency-Key → `replayed=true`，不产生第二条消息。
      parameters:
        - name: consultationId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorReplyRequest'}
      responses:
        '200':
          description: 已发送。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkDoctorReplySent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /api/v1/consultations/{consultationId}/triage:
    post:
      operationId: requestConsultationTriage
      x-idempotency: not-required
      tags: [consultation]
      summary: 会话内 AI 分诊建议（只建任务，不同步等模型）
      description: |
        把会话内患者全部描述聚合成症状文本交远端模型，返回 `AiTask`（轮询
        `GET /api/v1/ai/tasks/{taskId}` 取结果）。只建任务不写业务数据，
        同会话 60s 内重复调用复用既有任务，故不要求 Idempotency-Key。
        会话不属于当前用户 → `404`。
      parameters:
        - name: consultationId
          in: path
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                requestedProfile: {type: string, maxLength: 40, description: 期望的分诊档位（缺省由服务端决定）。}
      responses:
        '200':
          description: 已建任务。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkAiTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/v1/beds:
    get:
      operationId: listBeds
      tags: [doctor]
      summary: 床位列表
