          schema: {type: string, enum: [AVAILABLE, OCCUPIED, RESERVED, CLEANING, OUT_OF_SERVICE]}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 床位列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OkBedList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/beds/{bedId}/assignment:
