# 文档级扩展
# ============================================================================

x-boundary:
  description: 强制边界，由 tools/check-v4-contracts.js 校验。
  rules:
    - 本文件中的任何路径都不得出现在网关的对外路由表中，也不得出现在 miniprogram/config/api.js 里。
    - 本文件与 business-openapi.yaml 的路径集合不得重叠：重叠意味着同一路径有两个归属，路由将不可预测。
    - 小程序可见的 AI 能力一律经 Spring Boot；FastAPI 不签发用户令牌，也不写业务库。
    - 语音能力（ASR/TTS）同样如此：客户端调 /api/v1/voice/*（Spring Boot），不调本服务。

x-open-items:
  - id: O-02
    title: 任务终态回传方式未定稿
    impact: |
      回调端点的路径与载荷未定稿（见 docs/v4/04 第 3 节）。因此本文件不声明回传端点，
      Spring Boot 侧以轮询 GET /internal/v1/tasks/{taskId} 为唯一权威路径。
    until_resolved: 任何实现都不得以"等待回调"为由把任务永久留在 RUNNING；轮询必须有总超时预算，超时按 EXPIRED 处理。
  - id: O-01
    title: 对象存储直传与代理未定
    impact: |
      音频与图片的上传路径未定。本文件不承担上传职责，也不接收大文件字节；
      ASR 只接收 Spring Boot 已校验并转码后的音频引用或受控流。
    until_resolved: 不得在客户端与对象存储之间建立任何绕过 Spring Boot 校验的通道。
  - id: O-03
    title: 缓存键字段命名
    impact: |
      本文件的 Task 模型已暴露参与缓存键的全部字段（modelId / modelVersion / quantization /
      promptTemplateVersion / policyVersion / knowledgeSnapshot / voice / locale /
      generationParameters），与 docs/v4/02 第 8 节、docs/v4/04 第 9.2 节的字段集一致。
    until_resolved: 字段集变更必须同时改两处文档与本契约，任何一处单独变更都会让缓存失效判断出错。
