# 测试档（prodtest）默认附件签名密钥（2026-10-23 附件签名 fail-fast 收口后补齐）。
# 与 application-itest.yml 同理：给未显式配置 sign-secret 的 prodtest 用例提供默认值。
app:
  attachment:
    sign-secret: test-sign-secret-0123456789abcdef

# 2026-11-05：与 application-itest.yml 同理，H2 档迁移停在 V26（V27 为 MySQL 专有 DDL）。
# 2026-11-16（REQ-14）：补 V26.1（db/migration-h2，仅 his_order_no / booking_source 两列），
# 与 itest 保持同一 H2 schema 口径；生产仍由 V31 落库。
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/migration-h2
    target: 26.1
