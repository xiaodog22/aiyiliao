# 测试档默认附件签名密钥（2026-10-23 附件签名 fail-fast 收口后补齐）。
# 背景：AttachmentStorage 现在未配置 app.attachment.sign-secret 即启动失败（生产防呆），
# 而多数契约测试（MessageCenterContractTest / M1~M5 等）并不显式传该属性；
# 本文件作为 itest profile 的默认值兜底（profile 配置与主 application.yml 分层合并）。
# 显式传入的用例（如 AttachmentSignatureTest 的 @SpringBootTest properties）优先级更高，不受影响。
#
# 2026-11-18（审计 H1/H2）：本档补齐两项显式配置 ——
#   · app.sms.provider=dev：主配置缺省已反转为 prod，单测/联调依赖 DevSmsSender.lastCode() 读验证码；
#   · app.auth.code-hash-secret：验证码改 HMAC-SHA256 后需密钥（无密钥会回落无盐摘要并告警）。
app:
  attachment:
    sign-secret: test-sign-secret-0123456789abcdef
  sms:
    provider: dev
  auth:
    code-hash-secret: test-code-hash-secret-0123456789abcdef
  # 审计 F4-1（2026-11-23）：健康数据单独同意门禁默认开启（application.yml）。
  # 单测档显式关闭，避免既有 900+ 用例全部要预置 consents 行；
  # 门禁本身由 HealthDataConsentGateTest 打开本开关独立验证（不是"只关不测"）。
  consent:
    require-health-data: false
  # 审计 F3-4（2026-11-23）：目录本地 TTL 缓存在单测档关闭，避免用例间读到上一条插入的科室。
  catalog:
    cache-seconds: 0

# 2026-11-05（V27）：H2 单测档的 Flyway 迁移停在 V26。
# 原因：V27__health_report_structure.sql 含 MySQL 专有 DDL
#   （ALTER TABLE ... ADD COLUMN a, ADD COLUMN b, ADD KEY ...），H2 MODE=MySQL 无法解析，
#   会让全部 @SpringBootTest 上下文启动失败（实测 319 项中 245 项连带 error）。
# V27 已在真实 wechar_dev 库由 Flyway 应用（rank 37，checksum 不可改动），
#   因此不修改已应用迁移；itest 用 target 跳过，保持既有 319 项语义不变。
# 代价与边界：H2 档没有报告新表，报告列表/详情的验收不由单测覆盖，
#   改由真实 MySQL + 启动后 HTTP 实测（阶段 07 交付报告如实标注）。
# 后续若新增 V28+ 通用 DDL，需同步调高本 target 并确认 H2 兼容性。
#
# 2026-11-16（REQ-14）：H2 档补一个 V26.1 迁移（db/migration-h2），只做 V31 的等价加列
# （his_order_no / booking_source）。原因：通用 APPT_COLS 已含这两列，而 target=26 时
# V31 不会执行 → 全部预约相关单测「Column not found」。locations 多目录只在本档生效，
# 生产 locations 不含 migration-h2，仍由 V31 落库（两边字段语义一致，不是绕过断言）。
#
# 2026-11-20（P0-3）：再补 V26.3（messages.biz_key + 唯一索引），对齐生产 V33 的消息幂等段；
# 报告投影列不补（H2 档没有 V27 报告表）。
# 2026-11-20（P0-1）：再补 V26.4（payment_orders 表），对齐生产 V34；target 调高到 26.4。
# 2026-11-22（L5）：补 V26.6（退费三列 + 取消 outbox + 对账差异台账），对齐生产 V37/V38；
# target 调高到 26.6（V26.5 已存在，故不能复用 26.5 的版本号）。
# 2026-11-23（B2）：补 V26.7（health_record_attachments.preview_object_key），对齐生产 V27 的
# 附件预览列；否则孤儿清理真实 SQL 集成测试只覆盖 object_key，D-03/D-04 仍会漏。
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/migration-h2
    target: 26.7

# 2026-11-18（审计 C3）：单测不连真实 ai-service，显式关闭服务间令牌启动自检；
# 生产/联调档仍为 true（缺 AI_SERVICE_TOKEN 即拒绝启动）。
ai:
  client:
    require-token: false
