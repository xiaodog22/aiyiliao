# CI —— 只跑"干净 clone 可复现、零外部依赖"的门禁（2026-11-17）
#
# 刻意不放进 CI 的项（不是遗漏，是口径）：
#   · db-verify.js        需要真实 MySQL 实例与种子数据 → 本地/发布前执行
#   · perf-gate.js        需要三服务在线（网关/Java/AI）           → 独立压测环境
#   · e2e-weapp / device-test  需要微信开发者工具、Android 设备  → 人工验收
#   · check-v4-docs / check-v4-prototypes  依赖 .gitignore 内设计存档，
#     干净 clone 下只会 SKIP；"SKIP"不能当"通过"，故不作阻断项（README 已写明）
#   · AI 真实模型链路（Ollama/Qdrant/edge-tts 联网）→ 独立验收流程，
#     不得为了让 CI 全绿而伪造通过结果
#
# 本流水线的定位：每个人在本地也跑得起的同一组命令，换成 PR 上自动执行。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: 安全门禁（H8/H9：密钥 / 演示账号 / 危险默认配置）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 阻断模式：命中 P0/P1 即非零退出。规则见 tools/security-gate.js
      # 含 L6 危险默认：HIS 配置 mode=mock、任意 matchIfMissing=true（SMS/HIS fail-open）。
      - name: 全仓敏感信息与危险默认配置（L6 门禁）
        run: node tools/security-gate.js
      # P3：用合成样例证明 fail-open / 默认口令 / mock 默认规则确实会命中。
      - name: 安全默认值规则回归（H1/M10/L6）
        run: node tools/test-security-defaults.js
      # P3：docker-compose 引用的变量必须在 .env.example 声明，AI 加密模板与 compose 口径一致。
      - name: 配置模板与 compose 一致性
        run: node tools/test-config-examples.js
      # 额外守卫：禁止把 env.local / 生产 .env 提交进仓库（允许 example/template）
      - name: 禁止提交本地环境覆盖文件
        run: |
          if git ls-files | grep -E '(^|/)(env\.local\.js|\.env\.local|\.env\.production)$'; then
            echo '::error::本地/生产环境覆盖文件不得入库（H9）'
            exit 1
          fi
      # P3 L8：IDE 私有配置只保留在工作区，不能重新被 git add。
      - name: 禁止跟踪 IDE 私有配置
        run: |
          if git ls-files | grep -E '^miniprogram/project\.private\.config\.json$'; then
            echo '::error::project.private.config.json 不得入库（L8）'
            exit 1
          fi

  frontend:
    name: 前端静态检查 + 逻辑测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 文档可点性（README + docs/INDEX，干净 clone 下不得有死链）
        run: |
          node tools/check-readme-links.js
          node tools/check-readme-links.js --file docs/INDEX.md
      - name: 静态门禁（require / 导出形状 / 路径与禁址 / 包体）
        run: |
          node tools/check-require.js
          node tools/check-exports.js
          node tools/check-project.js
      - name: 逻辑层测试（node:test）
        run: |
          node tools/test-fe.js
          node tools/test-triage.js
      - name: 在线问诊 safety 契约（服务端 safety → 急救横幅/120）
        run: node tools/test-consultation-safety.js
      - name: 导诊 golden set（红旗召回必须 100%）
        run: node tools/eval-triage.js
      # 2026-11-22 L12：急症词表唯一手写源 shared/triage-redflags.json，
      # 禁止只改源不生成（前端数据模块 / 服务端常量 / golden 样本三处必须一致）
      - name: 急症词表单一事实源一致性（shared → 三处产物）
        run: node tools/gen-triage-flags.js --check

  java:
    name: Java 单元/契约/集成（H2）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/business-service/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # backend/deploy/resources/ 是构建产物（.gitignore 排除，换机器可再生），但
      # ResourceAssetService 构造期会 fail-fast 校验该目录、ResourceAssetTest 还按 sha256
      # 读真实文件 → 干净 clone 上 341 项里 256 项上下文起不来。
      # 这里按部署前同一口径重建：先补入 3 个视频种子（唯一无法从包内再生的二进制），
      # 再用 resource-import.py 复制图片副本（与 docs 里「部署前跑一次」完全同一命令）。
      - name: 准备 deploy/resources（不入库的构建产物）
        run: |
          mkdir -p backend/deploy/resources
          cp backend/deploy/resources-seed/*.mp4 backend/deploy/resources/
          python tools/resource-import.py --write
      # 2026-11-22 P0/L12：服务端分诊金标准显式门禁（失败即阻断）。
      # TriageRedFlagParityTest 直接调 TriageRuleEngine.scanText 跑 29 条红旗 +
      # negativeCases 防误报；EmergencySafetyIntegrationTest 覆盖 endpoint / 建会话 /
      # 追加消息 / 幂等重放（safetyFor）四条链路，9 类急症必须全部 emergency=true。
      - name: 服务端分诊金标准（P0 门禁，失败即阻断）
        working-directory: backend/business-service
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=TriageRedFlagParityTest,EmergencySafetyIntegrationTest -DfailIfNoTests=false test
      - name: mvnw test
        working-directory: backend/business-service
        run: |
          chmod +x mvnw
          ./mvnw -B test

  clinic-his:
    name: clinic-his 安全回归（L4/L7/L10）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLINIC_ENV: test
      CLINIC_PATIENT_HASH_SALT: ci-test-patient-hash-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unittest
        working-directory: clinic-his
        run: python -m unittest discover -s tests -p "test_*.py" -v

  gateway:
    name: 网关 pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/edge-gateway/requirements.txt
      - name: 安装依赖
        working-directory: backend/edge-gateway
        run: python -m pip install -r requirements.txt
      - name: pytest
        working-directory: backend/edge-gateway
        run: python -m pytest tests -q

  ai-service:
    name: AI 服务 pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ai-service/requirements.txt
      - name: 安装依赖
        working-directory: backend/ai-service
        run: python -m pip install -r requirements.txt
      - name: pytest
        working-directory: backend/ai-service
        run: python -m pytest tests -q
